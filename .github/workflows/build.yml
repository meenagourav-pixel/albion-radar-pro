name: Android CI Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Pillow
      run: pip install Pillow

    - name: Clean all resource directories
      run: |
        echo "Removing all mipmap directories..."
        rm -rf app/src/main/res/mipmap-hdpi
        rm -rf app/src/main/res/mipmap-mdpi
        rm -rf app/src/main/res/mipmap-xhdpi
        rm -rf app/src/main/res/mipmap-xxhdpi
        rm -rf app/src/main/res/mipmap-xxxhdpi
        rm -rf app/src/main/res/mipmap-anydpi-v26
        echo "Removing build caches..."
        rm -rf app/build
        rm -rf build
        rm -rf .gradle
        echo "Clean complete"

    - name: Generate launcher icons
      run: python3 scripts/generate_icons.py

    - name: Recreate adaptive icons
      run: |
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
        </adaptive-icon>
        EOF
        cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
        </adaptive-icon>
        EOF
        echo "Adaptive icons created"

    - name: Verify all files
      run: |
        echo "=== Checking mipmap directories ==="
        ls -la app/src/main/res/ | grep mipmap || echo "No mipmap dirs"
        echo "=== Checking hdpi ==="
        ls -la app/src/main/res/mipmap-hdpi/ || echo "No hdpi"
        echo "=== Checking anydpi ==="
        ls -la app/src/main/res/mipmap-anydpi-v26/ || echo "No anydpi"
        echo "=== Validating XML files ==="
        for f in app/src/main/res/mipmap-anydpi-v26/*.xml; do
          head -1 "$f"
          tail -1 "$f"
        done

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean Gradle build
      run: ./gradlew clean

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
